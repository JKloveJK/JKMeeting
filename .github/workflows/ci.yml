name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: C++ core 单测
        run: make test-core

  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.26"
      - name: Go 单测（无数据库时自动跳过 DB 集成测试）
        env:
          DATABASE_URL: ""
          S3_ENDPOINT: "http://127.0.0.1:9000"
          S3_ACCESS_KEY: "ci"
          S3_SECRET_KEY: "ci"
        run: go -C server test ./...

  android:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Android JVM 单测与 Debug 构建（含 JNI/CMake）
        working-directory: android
        run: ./gradlew testDebugUnitTest assembleDebug

  apple:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: ObjC++ 桥接测试
        run: make test-apple-bridge
